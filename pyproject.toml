[project]
name = "myapp-starter"
version = "0.1.0"
description = "Starter template: aiohttp + SQLite (sqlite-utils) + tdom templates, mini-hexagonal architecture with Phoenix-style contexts."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "datastar-py>=1.0.3",
    "pwdlib[argon2]>=0.2",
    "sqlite-utils>=4.0",
    "tdom>=0.1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
    "pytest-asyncio>=0.24",
    "watchfiles>=1.3.0",
]

# App, not a library: uv only manages the environment, nothing to build.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
