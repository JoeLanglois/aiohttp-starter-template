[project]
name = "myapp-starter"
version = "0.1.0"
description = "Starter template: aiohttp + SQLite (sqlite-utils) + tdom templates, mini-hexagonal architecture with Phoenix-style contexts."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    # Floor is a security pin: <1.2.1 carries CVE-2026-111497
    # ("Node2Shell"), an out-of-bounds write in the Brotli C decoder.
    "brotli>=1.2.1",
    "datastar-py>=1.0.3",
    "pwdlib[argon2]>=0.2",
    "sqlite-utils>=4.0",
    "tdom>=0.1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
    "pytest-asyncio>=0.24",
    "watchfiles>=1.3.0",
]

# Console entry points: after `uv sync`, these exist in .venv/bin, so
# day-to-day commands are `uv run myapp`, `uv run myapp --dev` and
# `uv run myapp-admin create-user …` instead of `uv run python -m …`.
# (With the venv activated they're just `myapp` / `myapp-admin`.)
[project.scripts]
myapp = "myapp.__main__:main"
myapp-admin = "myapp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myapp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
